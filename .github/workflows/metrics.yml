name: Learner metrics

# Reads the app's anonymous GoatCounter counts back through its API every
# morning, keeps them in metrics.json on the `metrics` branch (never `main`,
# which would redeploy the app and tag a rollback point daily), and posts
# the week's digest to Slack: just after midnight on Fridays, West Africa
# Time, or on the first run after it when that one failed or was skipped.
# The dashboard at https://alxprograms.github.io/alx-pace/metrics/ reads the
# same file.
#
# Secrets, added by the repository owner (Settings → Secrets → Actions):
#   GOATCOUNTER_API_KEY  a GoatCounter API key with "Read statistics" only
#   SLACK_WEBHOOK_URL    a Slack incoming webhook for the digest's channel
# Without the first, the job collects nothing and says so; without the
# second, it prints the digest in the log instead of posting it. Neither
# turns the run red.

on:
  schedule:
    # 05:23 UTC = 06:23 West Africa Time (no DST): yesterday is complete by then.
    - cron: '23 5 * * *'
    # Thursdays 23:03 UTC = Fridays 00:03 West Africa Time: collects the
    # Thursday just ended there and posts the Friday-to-Thursday digest.
    # GitHub can start a scheduled run late, or skip it when busy; the next
    # morning's run then posts it.
    - cron: '3 23 * * 4'
  workflow_dispatch:
    inputs:
      digest:
        description: Post the last full week's Slack digest again
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check out the metrics branch beside the code
        id: worktree
        run: |
          # Full ref names: a bare "metrics" would also match a branch such as
          # kayode/metrics, or a tag named metrics.
          if git ls-remote --exit-code origin refs/heads/metrics > /dev/null; then
            git fetch --depth 1 origin refs/heads/metrics
            git worktree add --detach metrics-data FETCH_HEAD
          else
            # First run: an empty branch with no history of the app's code.
            git worktree add --detach metrics-data
            git -C metrics-data checkout --orphan metrics
            git -C metrics-data rm -rf --quiet .
          fi

      - name: Collect from GoatCounter, today so far included
        id: collect
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: node scripts/metrics/collect.mjs --dir metrics-data

      # Before the digest, so its "Open the dashboard" link finds the week it
      # links already published; and whatever the digest does, the numbers keep.
      - name: Commit the numbers to the metrics branch
        if: always() && steps.worktree.outcome == 'success'
        working-directory: metrics-data
        run: |
          if [ ! -f metrics.json ]; then
            echo "Nothing collected."
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No new numbers."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "Learner metrics to $(date -u +%F)"
          git push --quiet origin HEAD:refs/heads/metrics

      # Every run: digest.mjs posts a week only once (it keeps the last week
      # posted in digest.json), so a Friday run that failed or never came is
      # caught up by the next morning's. Never on numbers a failed collection
      # left half-done.
      - name: Post the week's digest to Slack, once
        if: steps.collect.outcome == 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FORCE: ${{ inputs.digest }}
        run: node scripts/metrics/digest.mjs --dir metrics-data

      # digest.json: which week went to Slack, so it isn't posted twice.
      - name: Record the digest posted
        if: always() && steps.worktree.outcome == 'success'
        working-directory: metrics-data
        run: |
          if [ ! -f metrics.json ]; then
            echo "Nothing collected."
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No digest posted."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "Slack digest posted $(date -u +%F)"
          git push --quiet origin HEAD:refs/heads/metrics
